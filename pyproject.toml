# Packaging and tool configuration.
#
# `requirements.txt` stays the pinned source of truth — §2 pins LangGraph
# because its API moves, and a floating install is how a green suite starts
# failing without a commit. This file makes the project importable without a
# sys.path hack and gives pytest somewhere to live; it does not re-declare the
# pins in a second place that can drift from the first.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.1.0"
description = "An agentic personal expense analyst with verified, traceable answers"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
ledgerlens-ingest = "ledgerlens.ingest.__main__:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["ledgerlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Starlette's TestClient nags about httpx2 the first time it is imported.
    # Not this project's deprecation, and it is the only warning the suite
    # emits — leaving it in place means the count is never zero, so a real
    # warning appearing has nothing to stand out against.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"   # the container runs 3.12; local dev is 3.14

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "RUF", "BLE"]
ignore = [
    # Several tool nodes catch Exception deliberately and say so in a comment
    # beside the handler: a failing anomaly detector or a missing vector index
    # degrades the answer, and taking the whole graph down over it would be a
    # worse outcome than a partial one. The rule is right in general and wrong
    # for the specific thing this codebase does on purpose.
    "BLE001",
    # `file: UploadFile = File(...)` is how FastAPI declares an upload. The
    # rule cannot know the default is a marker object, not a live call.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# The reference queries are SQL literals. Wrapping them to satisfy a line
# length would make the thing being asserted harder to read than the rule is
# worth.
"evals/*" = ["E501"]
# Data tables: a 50-state list and the synthetic merchant catalog. Wrapping a
# literal table to satisfy a line length makes it harder to read, not easier.
"ledgerlens/synthetic.py" = ["E501"]
"ledgerlens/ingest/merchants.py" = ["E501"]
